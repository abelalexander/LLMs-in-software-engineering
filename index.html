<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transaction history</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="page-shell" data-user-id="demo-user">
      <header class="page-heading">
        <p class="eyebrow">Personal finances</p>
        <h1>Transaction history</h1>
        <p class="subtitle">Review and filter your recent account activity.</p>
      </header>

      <section class="transaction-panel" aria-labelledby="transaction-heading">
        <h2 id="transaction-heading">Add transaction</h2>
        <form id="transaction-form">
          <div class="transaction-form-grid">
            <label>
              Date
              <input id="transaction-date" type="date" required>
            </label>
            <label>
              Description
              <input id="transaction-description" type="text" required>
            </label>
            <label>
              Category
              <input id="transaction-category" type="text" required>
            </label>
            <label>
              Amount
              <input id="transaction-amount" type="number" step="any" required>
            </label>
          </div>
          <button type="submit">Add transaction</button>
        </form>
      </section>

      <section class="filters-panel" aria-labelledby="filters-heading">
        <div class="filters-heading">
          <h2 id="filters-heading">Filters</h2>
          <button id="reset-filters" class="reset-button" type="button" hidden>
            Clear filters
          </button>
        </div>
        <div class="filter-grid">
          <label>
            Search
            <input id="keyword-filter" type="search" placeholder="Merchant or description">
          </label>
          <label>
            Category
            <select id="category-filter">
              <option value="">All categories</option>
            </select>
          </label>
          <label>
            From
            <input id="from-filter" type="date">
          </label>
          <label>
            To
            <input id="to-filter" type="date">
          </label>
        </div>
      </section>

      <section aria-labelledby="results-heading">
        <div class="results-heading">
          <h2 id="results-heading">Transactions</h2>
          <p id="results-count" class="results-count" aria-live="polite"></p>
        </div>
        <p id="status-message" class="status-message" role="status"></p>
        <button id="retry-history" type="button" hidden>Retry loading history</button>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr><th scope="col">Date</th><th scope="col">Description</th><th scope="col">Category</th><th scope="col">Status</th><th scope="col">Amount</th></tr>
            </thead>
            <tbody id="transaction-list"></tbody>
          </table>
        </div>
        <nav class="pagination" aria-label="Transaction pages">
          <button id="previous-page" type="button">Previous</button>
          <span id="page-label"></span>
          <button id="next-page" type="button">Next</button>
        </nav>
      </section>
    </main>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
